syntax = "proto3";

enum error {
  ENone = 0;
  ETermStale = 1;
  ENotLeader = 2;
  EQuorumFailed = 3;
}

message config {
  // De-alias grove_ffi.Address to uint64
  repeated uint64 members = 1;
  // De-alias grove_ffi.Address to uint64
  repeated uint64 nextMembers = 2;
}

message monotonicValue {
  uint64 version = 1;
  bytes val = 2;
  config conf = 3;
}

message prepareReply {
  error err = 1;
  uint64 term = 2;
  monotonicValue val = 3;
}

 message proposeArgs {
   uint64 term = 1;
   monotonicValue val = 2;
 }

message tryCommitReply {
  error err = 1;
  uint64 version = 2;
}
